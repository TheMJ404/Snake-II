<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snake II — Nokia Style</title>


<style>
  /* ---------------------------------------------------------------------
     DESIGN TOKENS — monochrome Nokia LCD colors plus the "candybar phone"
     plastic palette used for the surrounding chrome.
  --------------------------------------------------------------------- */
  :root{
    --lcd-bg: #c7d6a3;
    --lcd-fg: #33421f;
    --lcd-bg-dim: #b9c993;


    --page-bg-1: #23262f;
    --page-bg-2: #101116;


    --phone-1: #454b59;
    --phone-2: #2b2e37;
    --phone-3: #17181d;


    --bezel: #0c0d10;


    --key-face: #3b4050;
    --key-face-hi: #565c70;
    --key-face-lo: #23262f;
    --key-text: #d9dde6;


    --soft-face: #31353f;
    --soft-text: #cfd4e0;
  }


  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }


  html, body{
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at 50% 20%, var(--page-bg-1) 0%, var(--page-bg-2) 75%);
    color: var(--key-text);
    font-family: "Courier New", Courier, monospace;
    overflow-y: auto;
    overscroll-behavior: none;
  }


  body{
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 12px env(safe-area-inset-bottom, 16px);
  }


  /* ---------------------------------------------------------------------
     INSTRUCTION HEADER — positioned above the console for maximum mobile clearance
  --------------------------------------------------------------------- */
  .hint{
    max-width: 420px;
    text-align: center;
    font-size: 11px;
    line-height: 1.5;
    color: #7d8298;
    letter-spacing: 0.3px;
    padding: 4px 10px;
    flex: none;
  }


  /* ---------------------------------------------------------------------
     PHONE CHROME — candybar body & screen bezel
  --------------------------------------------------------------------- */
  .phone{
    width: min(92vw, 400px);
    background:
      linear-gradient(160deg, var(--phone-1) 0%, var(--phone-2) 55%, var(--phone-3) 100%);
    border-radius: 30px 30px 46px 46px;
    padding: 18px 16px 22px;
    box-shadow:
      0 18px 40px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -2px 10px rgba(0,0,0,0.5);
    position: relative;
    flex: none;
  }


  .phone-top-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px 10px;
  }


  .phone-speaker{
    width: 46px;
    height: 5px;
    border-radius: 3px;
    background: linear-gradient(90deg, #0a0a0c, #1c1e24, #0a0a0c);
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.8);
  }


  .brand{
    font-size: 11px;
    letter-spacing: 3px;
    font-weight: 700;
    color: #8b91a3;
    -webkit-text-stroke: 0.3px #8b91a3;
  }


  .sound-toggle{
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, var(--key-face-hi), var(--key-face-lo));
    color: var(--key-text);
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 3px rgba(0,0,0,0.5);
  }
  .sound-toggle:active{ transform: translateY(1px) scale(0.94); }


  .screen-bezel{
    background: var(--bezel);
    border-radius: 14px;
    padding: 10px;
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,0.85),
      inset 0 0 0 2px rgba(255,255,255,0.02);
  }


  .lcd{
    position: relative;
    background: var(--lcd-bg);
    border-radius: 4px;
    padding: 6px 7px 8px;
    box-shadow: inset 0 0 14px rgba(0,0,0,0.28);
    overflow: hidden;
  }


  .lcd::after{
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.07) 0px,
      rgba(0,0,0,0.07) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: multiply;
  }


  .lcd-chrome{
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--lcd-fg);
    opacity: 0.75;
    padding: 0 1px 3px;
  }


  .lcd-hud{
    display: flex;
    justify-content: space-between;
    font-size: clamp(10px, 3.1vw, 13px);
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--lcd-fg);
    padding: 1px 2px 5px;
    text-shadow: 0 0 1px rgba(51,66,31,0.35);
  }


  .lcd-canvas-row{
    display: flex;
    justify-content: center;
  }


  .canvas-wrap{
    position: relative;
    width: 100%;
  }


  canvas{
    display: block;
    image-rendering: pixelated;
  }


  /* ---------------------------------------------------------------------
     DIRECT TOUCH OVERLAY PANELS — start screen / pause / game over
  --------------------------------------------------------------------- */
  .overlay-panel{
    display: none;
    position: absolute;
    inset: 0;
    background: var(--lcd-bg);
    color: var(--lcd-fg);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 5px;
    padding: 5px 10px;
    overflow-y: auto;
    z-index: 10;
    -webkit-overflow-scrolling: touch;
  }
  .overlay-panel.active{ display: flex; }


  .title{
    font-size: clamp(17px, 6vw, 24px);
    font-weight: 700;
    letter-spacing: 3px;
    -webkit-text-stroke: 0.6px var(--lcd-fg);
    margin: 0 0 2px;
    flex: none;
  }


  .subtitle{
    font-size: clamp(9px, 2.6vw, 11px);
    letter-spacing: 1px;
    opacity: 0.8;
    margin-bottom: 6px;
  }


  .lcd-btn-row{
    display: flex;
    gap: 6px;
    justify-content: center;
    flex: none;
  }


  .lcd-btn{
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 1px;
    font-size: clamp(10px, 2.8vw, 12px);
    background: transparent;
    color: var(--lcd-fg);
    border: 2px solid var(--lcd-fg);
    border-radius: 3px;
    padding: 6px 10px;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
  }
  .lcd-btn.active,
  .lcd-btn:active{
    background: var(--lcd-fg);
    color: var(--lcd-bg);
  }


  .lcd-btn.small{
    font-size: clamp(9px, 2.3vw, 10.5px);
    padding: 3px 7px;
    border-width: 1.5px;
    letter-spacing: 0.5px;
  }


  .lcd-btn-primary{
    font-size: clamp(12px, 3.4vw, 15px);
    padding: 7px 22px;
    margin-top: 2px;
    flex: none;
  }


  .maze-picker{
    display: none;
    align-items: center;
    gap: 8px;
    font-size: clamp(9px, 2.6vw, 11px);
    letter-spacing: 0.5px;
  }
  .maze-picker button{
    font-family: inherit;
    font-weight: 700;
    background: transparent;
    border: 1px solid var(--lcd-fg);
    color: var(--lcd-fg);
    border-radius: 3px;
    width: 22px;
    height: 22px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .maze-picker span{ min-width: 96px; }


  .stat-line{
    font-size: clamp(11px, 3vw, 13px);
    letter-spacing: 0.5px;
  }
  .stat-line b{ letter-spacing: 1px; }


  .blink{
    animation: blinker 1.1s step-start infinite;
  }
  @keyframes blinker{ 50% { opacity: 0; } }


  .new-badge{
    display: none;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 1px 6px;
    border: 1px solid var(--lcd-fg);
    border-radius: 3px;
  }


  /* ---------------------------------------------------------------------
     CONTROLS — Soft keys & 4-Way Diamond D-Pad
  --------------------------------------------------------------------- */
  .phone-controls{
    margin-top: 16px;
  }


  .softkeys-row{
    display: flex;
    justify-content: space-between;
    padding: 0 6px 12px;
  }


  .softkey{
    font-family: inherit;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--soft-text);
    background: linear-gradient(180deg, var(--key-face-hi), var(--soft-face));
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    min-width: 78px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
    touch-action: manipulation;
  }
  .softkey:active{
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
  }


  .dpad{
    display: grid;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(3, 58px);
    gap: 2px;
    justify-content: center;
    margin: 0 auto;
    position: relative;
  }


  .dkey{
    font-size: 20px;
    color: var(--key-text);
    background: radial-gradient(circle at 35% 30%, var(--key-face-hi), var(--key-face-lo));
    border: none;
    box-shadow: 0 3px 0 rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.12);
    cursor: pointer;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .dkey:active{
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08);
  }


  .dkey.up{
    grid-column: 2;
    grid-row: 1;
    border-radius: 18px 18px 6px 6px;
  }
  .dkey.left{
    grid-column: 1;
    grid-row: 2;
    border-radius: 18px 6px 6px 18px;
  }
  .dkey.right{
    grid-column: 3;
    grid-row: 2;
    border-radius: 6px 18px 18px 6px;
  }
  .dkey.down{
    grid-column: 2;
    grid-row: 3;
    border-radius: 6px 6px 18px 18px;
  }
</style>
</head>
<body>


  <!-- Instruction Header (Placed above phone for optimal mobile clearance) -->
  <div class="hint">
    Desktop: Arrow keys / WASD move · Space pause · Enter or R restart<br>
    Mobile: Tap screen options directly or use the D-Pad / swipe gestures
  </div>


  <div class="phone">
    <div class="phone-top-row">
      <div class="phone-speaker"></div>
      <div class="brand">NOKIA</div>
      <button class="sound-toggle" id="soundToggleBtn" title="Toggle sound">🔊</button>
    </div>


    <div class="screen-bezel">
      <div class="lcd" id="lcd">
        <div class="lcd-chrome">
          <span>▂▄▆█</span>
          <span id="lcdClock">--:--</span>
          <span>▮▮▮</span>
        </div>


        <div class="lcd-hud">
          <span>SC <b id="statusScore">000</b></span>
          <span>LEN <b id="statusLen">03</b></span>
          <span>HI <b id="statusHi">000</b></span>
        </div>


        <div class="lcd-canvas-row">
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="gameCanvas"></canvas>


            <!-- START SCREEN OVERLAY -->
            <div class="overlay-panel" id="overlayStart">
              <h1 class="title">SNAKE II</h1>


              <div class="lcd-btn-row">
                <button class="lcd-btn" id="btnModeClassic">CLASSIC</button>
                <button class="lcd-btn" id="btnModeMaze">MAZE</button>
              </div>


              <div class="maze-picker" id="mazeSelectWrap">
                <button id="btnMazePrev" aria-label="Previous maze">◀</button>
                <span id="mazeLabel">—</span>
                <button id="btnMazeNext" aria-label="Next maze">▶</button>
              </div>


              <div class="lcd-btn-row">
                <button class="lcd-btn small" id="btnSpeedLow">LOW</button>
                <button class="lcd-btn small" id="btnSpeedMed">MED</button>
                <button class="lcd-btn small" id="btnSpeedHigh">HIGH</button>
              </div>


              <div class="lcd-btn-row">
                <button class="lcd-btn small" id="btnThemeGreen">GREEN</button>
                <button class="lcd-btn small" id="btnThemeDark">DARK</button>
                <button class="lcd-btn small" id="btnThemeBlue">BLUE</button>
              </div>


              <div class="stat-line">HI-SCORE: <b id="startHiScore">000</b></div>


              <button class="lcd-btn lcd-btn-primary" id="btnStart">START</button>
            </div>


            <!-- PAUSE SCREEN OVERLAY -->
            <div class="overlay-panel" id="overlayPause">
              <h1 class="title" style="font-size:22px;">PAUSED</h1>
              <div class="subtitle blink">TAP RESUME OR PRESS SPACE</div>
              <button class="lcd-btn lcd-btn-primary" id="btnResume">RESUME</button>
            </div>


            <!-- GAME OVER OVERLAY -->
            <div class="overlay-panel" id="overlayGameover">
              <h1 class="title" style="font-size:22px;">GAME OVER</h1>
              <div class="stat-line">SCORE: <b id="gameoverScore">0</b></div>
              <div class="stat-line">LENGTH: <b id="gameoverLen">0</b></div>
              <div class="stat-line">
                HI-SCORE: <b id="gameoverHi">0</b>
                <span class="new-badge" id="gameoverNewBadge">NEW!</span>
              </div>
              <div class="lcd-btn-row" style="margin-top:6px;">
                <button class="lcd-btn lcd-btn-primary" id="btnPlayAgain">AGAIN</button>
                <button class="lcd-btn lcd-btn-primary" id="btnGameoverMenu">MENU</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>


    <div class="phone-controls">
      <div class="softkeys-row">
        <button class="softkey" id="softLeft">START</button>
        <button class="softkey" id="softRight">MAZE</button>
      </div>


      <!-- 4-Way Diamond D-Pad Layout -->
      <div class="dpad">
        <button class="dkey up" id="dpadUp" aria-label="Up">▲</button>
        <button class="dkey left" id="dpadLeft" aria-label="Left">◀</button>
        <button class="dkey right" id="dpadRight" aria-label="Right">▶</button>
        <button class="dkey down" id="dpadDown" aria-label="Down">▼</button>
      </div>
    </div>
  </div>


<script>
(function(){
  "use strict";


  /* =======================================================================
     CONFIG
  ======================================================================= */
  const COLS = 23;               // logical grid width (cells)
  const ROWS = 13;               // logical grid height (cells)
  const SPEEDUP_EVERY = 5;       // speed up every N apples eaten
  const SPEEDUP_FACTOR = 0.92;   // tick interval multiplier applied on speed-up
  const SCORE_PER_APPLE = 10;    // points per apple


  const SPEED_PRESETS = {
    low:    { start: 220, min: 100 },
    medium: { start: 160, min: 65  },
    high:   { start: 110, min: 45  }
  };


  const THEMES = {
    green: { bg: "#c7d6a3", fg: "#33421f" },
    dark:  { bg: "#141812", fg: "#8fe06a" },
    blue:  { bg: "#c9e8f4", fg: "#0d3a52" }
  };


  let LCD_BG = THEMES.green.bg;
  let LCD_FG = THEMES.green.fg;


  const STORAGE_KEY_SCORES = "snakeII_highscores";
  const STORAGE_KEY_MUTED  = "snakeII_muted";
  const STORAGE_KEY_SPEED  = "snakeII_speed";
  const STORAGE_KEY_THEME  = "snakeII_theme";


  /* =======================================================================
     MAZE LAYOUTS
  ======================================================================= */
  function addRect(cells, x1, y1, x2, y2){
    for(let y = y1; y <= y2; y++){
      for(let x = x1; x <= x2; x++){
        cells.push([x, y]);
      }
    }
  }


  function mazeChamber(){
    const cells = [];
    for(let x = 6; x <= 16; x++){ if(x !== 11) cells.push([x, 3]); }
    for(let x = 6; x <= 16; x++){ if(x !== 11) cells.push([x, 9]); }
    for(let y = 4; y <= 8; y++){ if(y !== 6) cells.push([6, y]); }
    for(let y = 4; y <= 8; y++){ if(y !== 6) cells.push([16, y]); }
    return cells;
  }


  function mazePillars(){
    const cells = [];
    addRect(cells, 5, 3, 6, 4);
    addRect(cells, 16, 3, 17, 4);
    addRect(cells, 5, 8, 6, 9);
    addRect(cells, 16, 8, 17, 9);
    cells.push([11, 5]);
    cells.push([11, 7]);
    return cells;
  }


  function mazeSlalom(){
    const cells = [];
    for(let y = 0; y <= 8; y++)  cells.push([10, y]);
    for(let y = 4; y <= 12; y++) cells.push([16, y]);
    return cells;
  }


  function mazeBorder(){
    return [];
  }


  const mazes = [
    { name: "CHAMBER", wrap: true,  build: mazeChamber },
    { name: "PILLARS", wrap: true,  build: mazePillars },
    { name: "SLALOM",  wrap: true,  build: mazeSlalom  },
    { name: "BORDER",  wrap: false, build: mazeBorder  }
  ];


  /* =======================================================================
     STATE
  ======================================================================= */
  let gameState = "start";       // 'start' | 'playing' | 'paused' | 'gameover'
  let mode = "classic";
  let selectedMode = "classic";
  let selectedMazeIndex = 0;
  let selectedSpeed = "medium";
  let selectedTheme = "green";


  let snake = [];
  let currentDirection = { dx: 1, dy: 0 };
  let nextDirection = { dx: 1, dy: 0 };
  let food = { x: -1, y: -1 };
  let wallSet = new Set();
  let wrapEnabled = true;


  let score = 0;
  let applesEaten = 0;
  let tickInterval = SPEED_PRESETS.medium.start;
  let tickMin = SPEED_PRESETS.medium.min;


  let highScores = { classic: 0, maze: 0 };
  let muted = false;


  let lastTickTime = 0;
  let accumulator = 0;


  let CELL = 10, cssW = 0, cssH = 0;


  /* =======================================================================
     DOM REFERENCES
  ======================================================================= */
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const canvasWrap = document.getElementById("canvasWrap");
  const lcdEl = document.getElementById("lcd");
  const lcdClockEl = document.getElementById("lcdClock");


  const statusScore = document.getElementById("statusScore");
  const statusLen = document.getElementById("statusLen");
  const statusHi = document.getElementById("statusHi");


  const overlayStart = document.getElementById("overlayStart");
  const overlayPause = document.getElementById("overlayPause");
  const overlayGameover = document.getElementById("overlayGameover");


  const btnModeClassic = document.getElementById("btnModeClassic");
  const btnModeMaze = document.getElementById("btnModeMaze");
  const mazeSelectWrap = document.getElementById("mazeSelectWrap");
  const btnMazePrev = document.getElementById("btnMazePrev");
  const btnMazeNext = document.getElementById("btnMazeNext");
  const mazeLabel = document.getElementById("mazeLabel");
  const startHiScoreEl = document.getElementById("startHiScore");
  const btnStart = document.getElementById("btnStart");


  const btnSpeedLow = document.getElementById("btnSpeedLow");
  const btnSpeedMed = document.getElementById("btnSpeedMed");
  const btnSpeedHigh = document.getElementById("btnSpeedHigh");


  const btnThemeGreen = document.getElementById("btnThemeGreen");
  const btnThemeDark = document.getElementById("btnThemeDark");
  const btnThemeBlue = document.getElementById("btnThemeBlue");


  const btnResume = document.getElementById("btnResume");


  const gameoverScoreEl = document.getElementById("gameoverScore");
  const gameoverLenEl = document.getElementById("gameoverLen");
  const gameoverHiEl = document.getElementById("gameoverHi");
  const gameoverNewBadge = document.getElementById("gameoverNewBadge");
  const btnPlayAgain = document.getElementById("btnPlayAgain");
  const btnGameoverMenu = document.getElementById("btnGameoverMenu");


  const softLeft = document.getElementById("softLeft");
  const softRight = document.getElementById("softRight");


  const dpadUp = document.getElementById("dpadUp");
  const dpadDown = document.getElementById("dpadDown");
  const dpadLeft = document.getElementById("dpadLeft");
  const dpadRight = document.getElementById("dpadRight");


  const soundToggleBtn = document.getElementById("soundToggleBtn");


  ctx.imageSmoothingEnabled = false;


  /* =======================================================================
     AUDIO
  ======================================================================= */
  let audioCtx = null;


  function ensureAudioContext(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state === "suspended"){
      audioCtx.resume();
    }
  }


  function beep(freq, durationMs, type, volume){
    if(muted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + durationMs / 1000);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + durationMs / 1000);
  }


  function playEatSound(){
    beep(880, 90, "square", 0.18);
    setTimeout(function(){ beep(1320, 70, "square", 0.14); }, 40);
  }
  function playCrashSound(){
    beep(160, 320, "sawtooth", 0.2);
  }
  function playUiSound(){
    beep(660, 50, "square", 0.1);
  }


  function unlockAudioOnce(){
    ensureAudioContext();
  }
  window.addEventListener("pointerdown", unlockAudioOnce, { once: true });
  window.addEventListener("keydown", unlockAudioOnce, { once: true });


  /* =======================================================================
     LOCAL STORAGE
  ======================================================================= */
  function loadHighScores(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY_SCORES);
      if(raw){
        const parsed = JSON.parse(raw);
        return {
          classic: parsed.classic | 0,
          maze: parsed.maze | 0
        };
      }
    }catch(e){}
    return { classic: 0, maze: 0 };
  }


  function saveHighScores(){
    try{
      localStorage.setItem(STORAGE_KEY_SCORES, JSON.stringify(highScores));
    }catch(e){}
  }


  function loadMuted(){
    try{ return localStorage.getItem(STORAGE_KEY_MUTED) === "true"; }catch(e){ return false; }
  }


  function saveMuted(){
    try{ localStorage.setItem(STORAGE_KEY_MUTED, muted ? "true" : "false"); }catch(e){}
  }


  function loadSpeed(){
    try{
      const v = localStorage.getItem(STORAGE_KEY_SPEED);
      if(v === "low" || v === "medium" || v === "high") return v;
    }catch(e){}
    return "medium";
  }


  function saveSpeed(){
    try{ localStorage.setItem(STORAGE_KEY_SPEED, selectedSpeed); }catch(e){}
  }


  function loadTheme(){
    try{
      const v = localStorage.getItem(STORAGE_KEY_THEME);
      if(v === "green" || v === "dark" || v === "blue") return v;
    }catch(e){}
    return "green";
  }


  function saveTheme(){
    try{ localStorage.setItem(STORAGE_KEY_THEME, selectedTheme); }catch(e){}
  }


  /* =======================================================================
     GAME LOGIC
  ======================================================================= */
  function resetSnake(){
    const startY = Math.floor(ROWS / 2);
    snake = [
      { x: 5, y: startY },
      { x: 4, y: startY },
      { x: 3, y: startY }
    ];
    currentDirection = { dx: 1, dy: 0 };
    nextDirection = { dx: 1, dy: 0 };
  }


  function buildWallSet(forMode){
    if(forMode !== "maze") return new Set();
    const cells = mazes[selectedMazeIndex].build();
    const set = new Set();
    for(let i = 0; i < cells.length; i++){
      set.add(cells[i][0] + "," + cells[i][1]);
    }
    return set;
  }


  function placeFood(){
    const empties = [];
    for(let y = 0; y < ROWS; y++){
      for(let x = 0; x < COLS; x++){
        const key = x + "," + y;
        if(wallSet.has(key)) continue;
        let onSnake = false;
        for(let i = 0; i < snake.length; i++){
          if(snake[i].x === x && snake[i].y === y){ onSnake = true; break; }
        }
        if(onSnake) continue;
        empties.push({ x: x, y: y });
      }
    }
    if(empties.length === 0){
      food = { x: -1, y: -1 };
      return;
    }
    food = empties[Math.floor(Math.random() * empties.length)];
  }


  function setDirection(dx, dy){
    if(gameState !== "playing") return;
    if(snake.length > 1 && dx === -currentDirection.dx && dy === -currentDirection.dy) return;
    nextDirection = { dx: dx, dy: dy };
  }


  function tick(){
    currentDirection = nextDirection;
    const head = snake[0];
    let nx = head.x + currentDirection.dx;
    let ny = head.y + currentDirection.dy;


    if(wrapEnabled){
      nx = (nx + COLS) % COLS;
      ny = (ny + ROWS) % ROWS;
    } else if(nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS){
      endGame();
      return;
    }


    const newHead = { x: nx, y: ny };


    if(wallSet.has(newHead.x + "," + newHead.y)){
      endGame();
      return;
    }


    const eating = (newHead.x === food.x && newHead.y === food.y);
    const bodyToCheck = eating ? snake : snake.slice(0, -1);
    for(let i = 0; i < bodyToCheck.length; i++){
      if(bodyToCheck[i].x === newHead.x && bodyToCheck[i].y === newHead.y){
        endGame();
        return;
      }
    }


    snake.unshift(newHead);


    if(eating){
      score += SCORE_PER_APPLE;
      applesEaten += 1;
      playEatSound();
      if(applesEaten % SPEEDUP_EVERY === 0){
        tickInterval = Math.max(tickMin, Math.round(tickInterval * SPEEDUP_FACTOR));
      }
      placeFood();
      updateHud();
    } else {
      snake.pop();
    }
  }


  /* =======================================================================
     RENDERING
  ======================================================================= */
  function resizeCanvas(){
    const availW = canvasWrap.clientWidth || 280;
    CELL = Math.max(4, Math.floor(availW / COLS));
    cssW = CELL * COLS;
    cssH = CELL * ROWS;


    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;


    render();
  }


  function render(){
    ctx.fillStyle = LCD_BG;
    ctx.fillRect(0, 0, cssW, cssH);


    ctx.strokeStyle = LCD_FG;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.07;
    for(let x = 1; x < COLS; x++){
      ctx.beginPath();
      ctx.moveTo(x * CELL + 0.5, 0);
      ctx.lineTo(x * CELL + 0.5, cssH);
      ctx.stroke();
    }
    for(let y = 1; y < ROWS; y++){
      ctx.beginPath();
      ctx.moveTo(0, y * CELL + 0.5);
      ctx.lineTo(cssW, y * CELL + 0.5);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;


    if(!wrapEnabled){
      const lw = Math.max(2, Math.floor(CELL * 0.18));
      ctx.lineWidth = lw;
      ctx.strokeStyle = LCD_FG;
      ctx.strokeRect(lw / 2, lw / 2, cssW - lw, cssH - lw);
    }


    ctx.fillStyle = LCD_FG;
    wallSet.forEach(function(key){
      const parts = key.split(",");
      const x = Number(parts[0]), y = Number(parts[1]);
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    });


    if(food.x >= 0){
      const blinkOn = Math.floor(performance.now() / 350) % 2 === 0;
      if(blinkOn){
        ctx.beginPath();
        ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.32, 0, Math.PI * 2);
        ctx.fill();
      }
    }


    if(snake.length > 0){
      const pad = Math.max(1, Math.floor(CELL * 0.12));
      for(let i = 1; i < snake.length; i++){
        const seg = snake[i];
        ctx.fillRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
      }


      const head = snake[0];
      ctx.fillRect(head.x * CELL, head.y * CELL, CELL, CELL);
      ctx.fillStyle = LCD_BG;
      const eyeSize = Math.max(1, Math.floor(CELL * 0.18));
      const ex = head.x * CELL + CELL / 2 - eyeSize / 2 + currentDirection.dx * (CELL * 0.22);
      const ey = head.y * CELL + CELL / 2 - eyeSize / 2 + currentDirection.dy * (CELL * 0.22);
      ctx.fillRect(ex, ey, eyeSize, eyeSize);
    }
  }


  /* =======================================================================
     GAME LOOP
  ======================================================================= */
  function loop(now){
    if(gameState === "playing"){
      const delta = now - lastTickTime;
      lastTickTime = now;
      accumulator += delta;
      while(accumulator >= tickInterval && gameState === "playing"){
        tick();
        accumulator -= tickInterval;
      }
      render();
      requestAnimationFrame(loop);
    } else if(gameState === "paused"){
      lastTickTime = now;
      requestAnimationFrame(loop);
    }
  }


  /* =======================================================================
     STATE TRANSITIONS
  ======================================================================= */
  function startGame(){
    ensureAudioContext();
    playUiSound();
    mode = selectedMode;
    wallSet = buildWallSet(mode);
    wrapEnabled = (mode === "classic") ? true : mazes[selectedMazeIndex].wrap;
    resetSnake();
    score = 0;
    applesEaten = 0;
    const preset = SPEED_PRESETS[selectedSpeed] || SPEED_PRESETS.medium;
    tickInterval = preset.start;
    tickMin = preset.min;
    placeFood();


    gameState = "playing";
    updateHud();
    showScreen("playing");
    updateSoftKeys();


    lastTickTime = performance.now();
    accumulator = 0;
    requestAnimationFrame(loop);
  }


  function togglePause(){
    if(gameState === "playing"){
      gameState = "paused";
      lastTickTime = performance.now();
      showScreen("paused");
    } else if(gameState === "paused"){
      gameState = "playing";
      lastTickTime = performance.now();
      showScreen("playing");
    }
    updateSoftKeys();
    playUiSound();
  }


  function endGame(){
    playCrashSound();
    gameState = "gameover";


    const isNew = score > highScores[mode];
    if(isNew){
      highScores[mode] = score;
      saveHighScores();
    }


    gameoverScoreEl.textContent = String(score);
    gameoverLenEl.textContent = String(snake.length);
    gameoverHiEl.textContent = String(highScores[mode]);
    gameoverNewBadge.style.display = isNew ? "inline-block" : "none";


    updateHud();
    showScreen("gameover");
    updateSoftKeys();
    render();
  }


  function goToMenu(){
    playUiSound();
    gameState = "start";
    showScreen("start");
    refreshModeUI();
    updateHud();
    updateSoftKeys();
    render();
  }


  /* =======================================================================
     UI HELPERS
  ======================================================================= */
  function showScreen(name){
    overlayStart.classList.toggle("active", name === "start");
    overlayPause.classList.toggle("active", name === "paused");
    overlayGameover.classList.toggle("active", name === "gameover");
  }


  function updateHud(){
    statusScore.textContent = String(score).padStart(3, "0");
    statusLen.textContent = String(snake.length).padStart(2, "0");
    statusHi.textContent = String(highScores[mode]).padStart(3, "0");
  }


  function refreshModeUI(){
    btnModeClassic.classList.toggle("active", selectedMode === "classic");
    btnModeMaze.classList.toggle("active", selectedMode === "maze");
    mazeSelectWrap.style.display = selectedMode === "maze" ? "flex" : "none";
    startHiScoreEl.textContent = String(highScores[selectedMode]).padStart(3, "0");
    updateMazeLabel();
    updateSoftKeys();
  }


  function updateMazeLabel(){
    mazeLabel.textContent = mazes[selectedMazeIndex].name + " (" + (selectedMazeIndex + 1) + "/" + mazes.length + ")";
  }


  function refreshSpeedUI(){
    btnSpeedLow.classList.toggle("active", selectedSpeed === "low");
    btnSpeedMed.classList.toggle("active", selectedSpeed === "medium");
    btnSpeedHigh.classList.toggle("active", selectedSpeed === "high");
  }


  function selectSpeed(key){
    playUiSound();
    selectedSpeed = key;
    saveSpeed();
    refreshSpeedUI();
  }


  function applyTheme(key){
    const t = THEMES[key] || THEMES.green;
    LCD_BG = t.bg;
    LCD_FG = t.fg;
    lcdEl.style.setProperty("--lcd-bg", t.bg);
    lcdEl.style.setProperty("--lcd-fg", t.fg);
    render();
  }


  function refreshThemeUI(){
    btnThemeGreen.classList.toggle("active", selectedTheme === "green");
    btnThemeDark.classList.toggle("active", selectedTheme === "dark");
    btnThemeBlue.classList.toggle("active", selectedTheme === "blue");
  }


  function selectTheme(key){
    playUiSound();
    selectedTheme = key;
    applyTheme(key);
    saveTheme();
    refreshThemeUI();
  }


  function updateSoundIcon(){
    soundToggleBtn.textContent = muted ? "🔇" : "🔊";
  }


  function updateSoftKeys(){
    if(gameState === "start"){
      softLeft.textContent = "START";
      softLeft.onclick = startGame;
      softRight.textContent = selectedMode === "classic" ? "MAZE" : "CLASSIC";
      softRight.onclick = function(){
        playUiSound();
        selectedMode = selectedMode === "classic" ? "maze" : "classic";
        refreshModeUI();
      };
    } else if(gameState === "playing"){
      softLeft.textContent = "PAUSE";
      softLeft.onclick = togglePause;
      softRight.textContent = "MENU";
      softRight.onclick = goToMenu;
    } else if(gameState === "paused"){
      softLeft.textContent = "RESUME";
      softLeft.onclick = togglePause;
      softRight.textContent = "MENU";
      softRight.onclick = goToMenu;
    } else if(gameState === "gameover"){
      softLeft.textContent = "AGAIN";
      softLeft.onclick = startGame;
      softRight.textContent = "MENU";
      softRight.onclick = goToMenu;
    }
  }


  /* =======================================================================
     INPUT HANDLING — Direct Touch & Keyboard / D-Pad
  ======================================================================= */
  window.addEventListener("keydown", function(e){
    const key = e.key;


    if(key === "ArrowUp" || key === "ArrowDown" || key === "ArrowLeft" || key === "ArrowRight" || key === " "){
      e.preventDefault();
    }


    const k = key.length === 1 ? key.toLowerCase() : key;


    if(gameState === "playing"){
      if(key === "ArrowUp" || k === "w") setDirection(0, -1);
      else if(key === "ArrowDown" || k === "s") setDirection(0, 1);
      else if(key === "ArrowLeft" || k === "a") setDirection(-1, 0);
      else if(key === "ArrowRight" || k === "d") setDirection(1, 0);
    }


    if(key === " "){
      if(gameState === "playing" || gameState === "paused") togglePause();
    }


    if(k === "enter" || k === "r"){
      if(gameState === "gameover" || gameState === "start") startGame();
    }
  });


  function wireDpadButton(el, dx, dy){
    el.addEventListener("pointerdown", function(e){
      e.preventDefault();
      setDirection(dx, dy);
    });
  }
  wireDpadButton(dpadUp, 0, -1);
  wireDpadButton(dpadDown, 0, 1);
  wireDpadButton(dpadLeft, -1, 0);
  wireDpadButton(dpadRight, 1, 0);


  // Swipe gesture support directly on canvas
  let touchStartX = 0, touchStartY = 0;
  canvasWrap.addEventListener("touchstart", function(e){
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });


  canvasWrap.addEventListener("touchmove", function(e){
    if(gameState === "playing") e.preventDefault();
  }, { passive: false });


  canvasWrap.addEventListener("touchend", function(e){
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if(Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if(Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 1 : -1, 0);
    else setDirection(0, dy > 0 ? 1 : -1);
  }, { passive: true });


  /* Direct Touch Menu Handlers */
  btnModeClassic.addEventListener("click", function(){
    playUiSound();
    selectedMode = "classic";
    refreshModeUI();
  });
  btnModeMaze.addEventListener("click", function(){
    playUiSound();
    selectedMode = "maze";
    refreshModeUI();
  });
  btnMazePrev.addEventListener("click", function(){
    playUiSound();
    selectedMazeIndex = (selectedMazeIndex - 1 + mazes.length) % mazes.length;
    updateMazeLabel();
  });
  btnMazeNext.addEventListener("click", function(){
    playUiSound();
    selectedMazeIndex = (selectedMazeIndex + 1) % mazes.length;
    updateMazeLabel();
  });


  btnSpeedLow.addEventListener("click", function(){ selectSpeed("low"); });
  btnSpeedMed.addEventListener("click", function(){ selectSpeed("medium"); });
  btnSpeedHigh.addEventListener("click", function(){ selectSpeed("high"); });


  btnThemeGreen.addEventListener("click", function(){ selectTheme("green"); });
  btnThemeDark.addEventListener("click", function(){ selectTheme("dark"); });
  btnThemeBlue.addEventListener("click", function(){ selectTheme("blue"); });


  btnStart.addEventListener("click", startGame);
  btnResume.addEventListener("click", togglePause);
  btnPlayAgain.addEventListener("click", startGame);
  btnGameoverMenu.addEventListener("click", goToMenu);


  soundToggleBtn.addEventListener("click", function(){
    muted = !muted;
    saveMuted();
    updateSoundIcon();
    if(!muted) playUiSound();
  });


  window.addEventListener("resize", function(){
    cancelAnimationFrame(resizeRAF);
    resizeRAF = requestAnimationFrame(resizeCanvas);
  });
  let resizeRAF = 0;


  /* =======================================================================
     DECORATIVE CLOCK
  ======================================================================= */
  function updateClock(){
    const d = new Date();
    let h = d.getHours();
    const m = d.getMinutes();
    lcdClockEl.textContent = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  }


  /* =======================================================================
     INIT
  ======================================================================= */
  function init(){
    highScores = loadHighScores();
    muted = loadMuted();
    updateSoundIcon();


    selectedSpeed = loadSpeed();
    refreshSpeedUI();


    selectedTheme = loadTheme();
    applyTheme(selectedTheme);
    refreshThemeUI();


    canvasWrap.style.aspectRatio = COLS + " / " + ROWS;


    refreshModeUI();
    resizeCanvas();
    showScreen("start");
    updateHud();
    updateSoftKeys();
    render();


    updateClock();
    setInterval(updateClock, 15000);
  }


  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
